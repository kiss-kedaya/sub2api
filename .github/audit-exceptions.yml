version: 1
# 高危/严重依赖漏洞的豁免清单。
#
# 判定逻辑见 tools/check_pnpm_audit_exceptions.py：只对「当前 pnpm audit 结果里
# 仍然出现」的高危/严重项校验是否有豁免、以及豁免是否过期。
# 因此**漏洞已经消失的条目会被静默忽略**——这类陈旧条目要及时删掉，
# 否则会给人「我们在跟踪」的假象。
# SheetJS now uses the fixed official 0.20.3 tarball with lockfile integrity.
# The unused icon dependency and its vulnerable transitive tree were removed.
# vue-i18n 11 carries the GHSA-83rm-6c8r-g728 fix, so its exemptions were removed
# with the 9.x -> 11.x upgrade instead of being extended.
exceptions:
  - package: follow-redirects
    advisory: GHSA-mrwp-f3q8-3g9p
    severity: high
    mitigation: Transitive dependency of axios. The panel only issues outbound HTTP to our own API origin, so there is no user-controlled redirect target and no cross-realm sensitiveHeaders reuse. Upgrade lands with the next axios bump.
    expires_on: 2026-12-31
  - package: rollup
    advisory: GHSA-mw96-cpmx-2vgc
    severity: high
    mitigation: Build-time dependency only. Release builds run from trusted repository inputs; untrusted archives are never passed to the Rollup bundle or plugin pipeline. Track the Vite major upgrade separately.
    expires_on: 2026-12-31
  - package: picomatch
    advisory: GHSA-c2c7-rcm5-vvqj
    severity: high
    mitigation: Dev/build transitive dependency. The application does not expose user-controlled glob patterns to picomatch; CI and the Vite build use repository-owned patterns only.
    expires_on: 2026-12-31
  - package: picomatch
    advisory: GHSA-fc5q-39xc-vjpf
    severity: high
    mitigation: Same dev/build transitive dependency as GHSA-c2c7-rcm5-vvqj (published 2026-11-17). Another ReDoS that needs an attacker-chosen glob pattern; only repository-owned patterns reach picomatch, at build time. Remove both entries once the build toolchain pulls a patched picomatch.
    expires_on: 2026-12-31
  - package: vite
    advisory: GHSA-587h-7wmj-h5pm
    severity: high
    mitigation: Dev/build dependency. Production serves the prebuilt static bundle embedded in the Go binary and never runs the Vite dev server or the launch-editor integration.
    expires_on: 2026-12-31
