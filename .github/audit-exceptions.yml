version: 1
# 高危/严重依赖漏洞的豁免清单。
#
# 判定逻辑见 tools/check_pnpm_audit_exceptions.py：只对「当前 pnpm audit 结果里
# 仍然出现」的高危/严重项校验是否有豁免、以及豁免是否过期。
# 因此**漏洞已经消失的条目会被静默忽略**——这类陈旧条目要及时删掉，
# 否则会给人「我们在跟踪」的假象。
# SheetJS now uses the fixed official 0.20.3 tarball with lockfile integrity.
# The unused icon dependency and its vulnerable transitive tree were removed.
# vue-i18n 9.x is EOL and will not receive the GHSA-83rm-6c8r-g728 fix.
# The app does not enable escapeParameter and does not render $t() results with
# v-html; translations are static files bundled in this repository. Keep this
# scoped exception until the planned vue-i18n 11 migration.
exceptions:
  - package: vue-i18n
    advisory: GHSA-83rm-6c8r-g728
    severity: high
    mitigation: No escapeParameter; no v-html rendering of translated messages; static bundled locales. Migration to vue-i18n 11 is tracked separately.
    expires_on: 2026-11-30
  - package: "@intlify/core-base"
    advisory: GHSA-83rm-6c8r-g728
    severity: high
    mitigation: Same vue-i18n 9.x transitive dependency; no escapeParameter or v-html translation rendering. Migration to vue-i18n 11 is tracked separately.
    expires_on: 2026-11-30
  - package: "@intlify/shared"
    advisory: GHSA-83rm-6c8r-g728
    severity: high
    mitigation: Same vue-i18n 9.x transitive dependency; no escapeParameter or v-html translation rendering. Migration to vue-i18n 11 is tracked separately.
    expires_on: 2026-11-30

  - package: follow-redirects
    advisory: GHSA-mrwp-f3q8-3g9p
    severity: high
    mitigation: Transitive dependency of axios. The panel only issues outbound HTTP to our own API origin, so there is no user-controlled redirect target and no cross-realm sensitiveHeaders reuse. Upgrade lands with the next axios bump.
    expires_on: 2026-12-31
  - package: rollup
    advisory: GHSA-mw96-cpmx-2vgc
    severity: high
    mitigation: Build-time dependency only. Release builds run from trusted repository inputs; untrusted archives are never passed to the Rollup bundle or plugin pipeline. Track the Nuxt/Vite-compatible upgrade separately.
    expires_on: 2026-12-31
  - package: picomatch
    advisory: GHSA-c2c7-rcm5-vvqj
    severity: high
    mitigation: Dev/build transitive dependency. The application does not expose user-controlled glob patterns to picomatch; CI and Nitro builds use repository-owned patterns only.
    expires_on: 2026-12-31
  - package: vite
    advisory: GHSA-587h-7wmj-h5pm
    severity: high
    mitigation: Dev/build dependency. Production serves the prebuilt Nuxt Nitro output and does not run the Vite dev server or launch-editor integration. Upgrade with the next Nuxt-compatible Vite major.
    expires_on: 2026-12-31
