name: SSR release artifact

# Runs after GoReleaser publishes the release: builds the Nuxt/Nitro bundle from
# the same tag, binds it to the released Go binary through release.json, and
# uploads one co-packaged artifact to that release.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (vX.Y.Z)'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: ssr-release-${{ github.event.release.tag_name || inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  # Nuxt 4.6.3 requires Node ^22.22.3 or ^24.15. 24.22 also builds the legacy Vite SPA.
  NODE_VERSION: '24.22'

jobs:
  ssr-artifact:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve tag
        id: ref
        env:
          EVENT_TAG: ${{ github.event.release.tag_name }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          TAG="${EVENT_TAG:-${INPUT_TAG:-}}"
          if [ -z "$TAG" ]; then
            echo "::error::no release tag (event has none and inputs.tag is empty)"
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ steps.ref.outputs.tag }}
          fetch-depth: 0
          persist-credentials: false

      - name: Assert the checkout is the release tag
        env:
          TAG: ${{ steps.ref.outputs.tag }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$(git rev-list -n 1 "$TAG")"

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: frontend

      - name: Build the Nuxt SSR bundle
        run: |
          pnpm run build
          pnpm run build:ssr
        working-directory: frontend

      - name: Resolve checked out commit
        id: commit
        run: echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Verify the SSR manifest
        run: >-
          node scripts/build-manifest.mjs verify
          --dir .output
          --mode ssr
          --expect-commit ${{ steps.commit.outputs.commit }}
        working-directory: frontend

      - name: Download the released Go binary
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.ref.outputs.tag }}
          VERSION: ${{ steps.ref.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p dist/backend
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern "sub2api_${VERSION}_linux_amd64.tar.gz" --dir dist/backend
          tar -xzf "dist/backend/sub2api_${VERSION}_linux_amd64.tar.gz" -C dist/backend sub2api
          test -x dist/backend/sub2api

      - name: Seal the release contract
        run: >-
          node deploy/nuxt/release.mjs seal
          --ssr frontend/.output
          --binary dist/backend/sub2api
          --spa-dist backend/internal/web/dist
          --out dist/release.json

      - name: Verify the release contract
        run: >-
          node deploy/nuxt/release.mjs verify
          --release dist/release.json
          --ssr frontend/.output
          --binary dist/backend/sub2api
          --spa-dist backend/internal/web/dist

      # A tag checkout carries the packaging helper that was current when the
      # tag was cut. v2.3.0 shipped .output/server/node_modules/@vueuse/shared and
      # @tanstack/virtual-core as absolute symlinks into /home/runner/work/...,
      # which is dead on every other machine. Packaging therefore always runs
      # with main's tooling, fetched after the build so the sealed manifest keeps
      # the clean tag checkout it was computed from.
      - name: Checkout packaging tooling from main
        uses: actions/checkout@v6
        with:
          ref: main
          path: .pack-tools
          fetch-depth: 1
          persist-credentials: false

      - name: Use the patched packaging tooling
        id: tooling
        run: |
          set -euo pipefail
          cp .pack-tools/deploy/nuxt/release.mjs deploy/nuxt/release.mjs
          cp .pack-tools/deploy/nuxt/smoke-ssr.mjs deploy/nuxt/smoke-ssr.mjs
          cp .pack-tools/deploy/nuxt/release.test.mjs deploy/nuxt/release.test.mjs
          # Fail loudly instead of silently repackaging with the old helper.
          grep -q 'copyTreeDereferenced' deploy/nuxt/release.mjs
          grep -q 'scanSymlinks' deploy/nuxt/smoke-ssr.mjs
          TOOLING_SHA="$(git -C .pack-tools rev-parse HEAD)"
          echo "packaging tooling from main@${TOOLING_SHA}"
          echo "tooling_sha=$TOOLING_SHA" >> "$GITHUB_OUTPUT"

      - name: Test the packaging tooling
        env:
          SSR_WORKFLOW_PATH: .pack-tools/.github/workflows/ssr-release.yml
        run: node --test deploy/nuxt/release.test.mjs

      - name: Stage and package
        env:
          VERSION: ${{ steps.ref.outputs.version }}
        run: |
          set -euo pipefail
          TARBALL="dist/sub2api_${VERSION}_ssr_linux_amd64.tar.gz"
          # stage dereferences build-workspace symlinks and refuses to emit a tree
          # that still contains one.
          node deploy/nuxt/release.mjs stage \
            --release dist/release.json \
            --ssr frontend/.output \
            --binary dist/backend/sub2api \
            --out dist/ssr
          tar -C dist --owner=0 --group=0 --numeric-owner -czf "$TARBALL" ssr
          # Belt and braces: the archive itself must not carry a single link entry.
          if tar -tvzf "$TARBALL" | grep -qE '^l'; then
            echo "::error::packaged archive contains symlink entries"
            tar -tvzf "$TARBALL" | awk '$1 ~ /^l/ {print}' | head -20
            exit 1
          fi
          ( cd dist && sha256sum "${TARBALL#dist/}" > "sub2api_${VERSION}_ssr_linux_amd64.checksums.txt" )

      # The only artifact worth trusting is the one that is about to be uploaded:
      # unpack it into a throwaway directory and boot that copy.
      - name: Smoke test the packaged tarball
        env:
          VERSION: ${{ steps.ref.outputs.version }}
        run: |
          set -euo pipefail
          EXTRACT="$(mktemp -d)"
          tar -xzf "dist/sub2api_${VERSION}_ssr_linux_amd64.tar.gz" -C "$EXTRACT"
          node deploy/nuxt/smoke-ssr.mjs --dir "$EXTRACT/ssr" --timeout 120000

      - name: Upload to the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.ref.outputs.tag }}
          VERSION: ${{ steps.ref.outputs.version }}
        run: |
          gh release upload "$TAG" \
            "dist/sub2api_${VERSION}_ssr_linux_amd64.tar.gz" \
            "dist/sub2api_${VERSION}_ssr_linux_amd64.checksums.txt" \
            --clobber