name: Release

on:
  push:
    tags:
      - 'v*'
  # A tag created alongside a branch push can be coalesced into one PushEvent
  # by GitHub. The create event is emitted for the tag itself, so it reliably
  # starts the release even when both refs are pushed in one command.
  create:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g., v1.0.0)'
        required: true
        type: string
      simple_release:
        description: 'Simple release: only x86_64 GHCR image, skip other artifacts'
        required: false
        type: boolean
        default: false
      all_platforms:
        description: 'Build all platforms (linux/darwin/windows, amd64+arm64) and multi-arch images. Default: linux/amd64 only'
        required: false
        type: boolean
        default: false

# 环境变量：合并 workflow_dispatch 输入和 repository variable
# tag push 触发时读取 vars.SIMPLE_RELEASE，workflow_dispatch 时使用输入参数
env:
  SIMPLE_RELEASE: ${{ github.event.inputs.simple_release == 'true' || vars.SIMPLE_RELEASE == 'true' }}
  # Default release builds linux/amd64 only. Set the workflow_dispatch input
  # all_platforms, or the repository variable RELEASE_ALL_PLATFORMS=true, to build
  # every platform and the multi-arch images (.goreleaser.yaml).
  ALL_PLATFORMS: ${{ github.event.inputs.all_platforms == 'true' || vars.RELEASE_ALL_PLATFORMS == 'true' }}
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.event_name == 'create' && github.event.ref || github.ref_name }}
  # Forks may not have write access to an existing GHCR package. Enable only after
  # the repository/package has been granted write:packages access.
  PUBLISH_GHCR: ${{ vars.PUBLISH_GHCR == 'true' }}

permissions:
  # Build and tag-resolution jobs only need to read the repository. Publish
  # and branch-sync permissions are granted narrowly on the jobs that need
  # them below.
  contents: read

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.event_name == 'create' && github.event.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  # Resolve the tag once and make every artifact-producing job use the same
  # immutable commit. This is important for workflow_dispatch and create
  # events, where actions/checkout's implicit ref can be the default branch.
  resolve_release_ref:
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && startsWith(github.ref_name, 'v')) || (github.event_name == 'create' && github.event.ref_type == 'tag' && startsWith(github.event.ref, 'v')) }}
    runs-on: ubuntu-latest
    outputs:
      commit_sha: ${{ steps.resolve.outputs.commit_sha }}
      release_tag: ${{ steps.resolve.outputs.release_tag }}
    steps:
      - name: Checkout default branch for tag resolution
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Resolve release tag to commit
        id: resolve
        shell: bash
        env:
          RELEASE_TAG: ${{ env.RELEASE_TAG }}
        run: |
          set -euo pipefail

          # Tag names are untrusted workflow input. Keep the existing v* release
          # convention, but reject control characters and invalid Git refs before
          # using the value in any Git command.
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+(\.[0-9]+){2}([+-][0-9A-Za-z.+-]+)?$ ]]; then
            echo "::error::RELEASE_TAG must be a valid semantic v-prefixed tag"
            exit 1
          fi

          git fetch --force --tags --prune origin
          if ! git check-ref-format --allow-onelevel "refs/tags/$RELEASE_TAG"; then
            echo "::error::RELEASE_TAG is not a valid tag ref"
            exit 1
          fi
          if ! git show-ref --verify --quiet "refs/tags/$RELEASE_TAG"; then
            echo "::error::Requested release tag does not exist"
            exit 1
          fi

          commit_sha="$(git rev-parse --verify --end-of-options "refs/tags/$RELEASE_TAG^{commit}")"
          printf 'commit_sha=%s\n' "$commit_sha" >> "$GITHUB_OUTPUT"
          printf 'release_tag=%s\n' "$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "Resolved $RELEASE_TAG to $commit_sha"

  # Update VERSION file with tag version
  update-version:
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && startsWith(github.ref_name, 'v')) || (github.event_name == 'create' && github.event.ref_type == 'tag' && startsWith(github.event.ref, 'v')) }}
    needs: [resolve_release_ref]
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.resolve_release_ref.outputs.commit_sha }}
          persist-credentials: false

      - name: Update VERSION file
        env:
          RELEASE_TAG: ${{ needs.resolve_release_ref.outputs.release_tag }}
        run: |
          set -euo pipefail
          VERSION="$RELEASE_TAG"
          VERSION=${VERSION#v}
          printf '%s\n' "$VERSION" > backend/cmd/server/VERSION
          echo "Updated VERSION file to: $VERSION"

      - name: Upload VERSION artifact
        uses: actions/upload-artifact@v7
        with:
          name: version-file
          path: backend/cmd/server/VERSION
          retention-days: 1

  build-frontend:
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && startsWith(github.ref_name, 'v')) || (github.event_name == 'create' && github.event.ref_type == 'tag' && startsWith(github.event.ref, 'v')) }}
    needs: [resolve_release_ref, update-version]
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.resolve_release_ref.outputs.commit_sha }}
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          # Nuxt 4.6.3 requires ^22.22.3 or ^24.15. 24.22 also builds the legacy Vite SPA.
          node-version: '24.22'
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Download VERSION artifact
        uses: actions/download-artifact@v8
        with:
          name: version-file
          path: backend/cmd/server/

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: frontend

      - name: Build frontend
        run: pnpm run build
        working-directory: frontend

      - name: Verify frontend manifest
        run: >-
          node scripts/build-manifest.mjs verify
          --dir ../backend/internal/web/dist
          --mode spa
          --expect-commit ${{ needs.resolve_release_ref.outputs.commit_sha }}
        working-directory: frontend

      - name: Upload frontend artifact
        uses: actions/upload-artifact@v7
        with:
          name: frontend-dist
          path: backend/internal/web/dist/
          retention-days: 1

  release:
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && startsWith(github.ref_name, 'v')) || (github.event_name == 'create' && github.event.ref_type == 'tag' && startsWith(github.event.ref, 'v')) }}
    needs: [resolve_release_ref, update-version, build-frontend]
    permissions:
      # GoReleaser creates the GitHub release and publishes GHCR images.
      contents: write
      packages: write
      # gh workflow run dispatches the SSR artifact build; workflow_dispatch
      # requires the Actions write scope on the job token.
      actions: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ needs.resolve_release_ref.outputs.commit_sha }}
          persist-credentials: false

      - name: Download VERSION artifact
        uses: actions/download-artifact@v8
        with:
          name: version-file
          path: backend/cmd/server/

      - name: Download frontend artifact
        uses: actions/download-artifact@v8
        with:
          name: frontend-dist
          path: backend/internal/web/dist/

      - name: Setup Node.js for manifest check
        uses: actions/setup-node@v6
        with:
          node-version: '24.22'

      # Anti-stale gate: the Go binary embeds exactly this directory. If the
      # artifact was built from another commit (cached/partial upload), fail
      # before GoReleaser produces a release whose UI does not match the API.
      - name: Verify embedded frontend matches the release commit
        run: >-
          node frontend/scripts/build-manifest.mjs verify
          --dir backend/internal/web/dist
          --mode spa
          --expect-commit ${{ needs.resolve_release_ref.outputs.commit_sha }}

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          check-latest: false
          cache-dependency-path: backend/go.sum

      - name: Verify Go version
        run: |
          go version | grep -q 'go1.26.11'

      # DockerHub publishing is optional. A step-level `env:` is not visible to
      # that same step's `if:`, so guarding on `env.DOCKERHUB_USERNAME` made the
      # DockerHub steps permanently unreachable. Resolve the secrets once here
      # and let later steps read this output.
      - name: Detect DockerHub credentials
        id: dockerhub
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [ -n "${DOCKERHUB_USERNAME:-}" ] && [ -n "${DOCKERHUB_TOKEN:-}" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
            echo "::notice title=DockerHub publish::credentials configured for user ${DOCKERHUB_USERNAME}; image push and description update enabled"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            reason="DOCKERHUB_USERNAME / DOCKERHUB_TOKEN secrets are not configured for this repository"
            echo "::notice title=DockerHub publish skipped::${reason}; skipping docker login and description update (GHCR publishing and GitHub release assets are unaffected)"
            {
              echo "### DockerHub publish skipped"
              echo ""
              echo "Reason: ${reason}. \`Login to DockerHub\` and \`Update DockerHub description\` were skipped; GHCR publishing and GitHub release assets are unaffected."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      # Decide what this release builds.
      #   default       .goreleaser.amd64.yaml: linux/amd64 archive + checksums.
      #   all platforms .goreleaser.yaml: five platforms and multi-arch images.
      #   simple        .goreleaser.simple.yaml: unchanged.
      # Images are only built when a registry push is configured. Without a
      # target they were built and then discarded. QEMU is only needed to build
      # the arm64 image, so it is only set up for the all-platforms path.
      - name: Select release scope
        id: scope
        env:
          PUSH_DOCKERHUB: ${{ steps.dockerhub.outputs.configured }}
          PUSH_GHCR: ${{ env.PUBLISH_GHCR }}
        run: |
          set -euo pipefail
          config=.goreleaser.amd64.yaml
          skip=validate
          qemu=false
          buildx=false
          if [ "$SIMPLE_RELEASE" = "true" ]; then
            config=.goreleaser.simple.yaml
            qemu=true
            buildx=true
          elif [ "$ALL_PLATFORMS" = "true" ]; then
            config=.goreleaser.yaml
            if [ "$PUSH_DOCKERHUB" = "true" ] || [ "$PUSH_GHCR" = "true" ]; then
              qemu=true
              buildx=true
            else
              skip=validate,docker
            fi
          fi
          {
            echo "config=$config"
            echo "skip=$skip"
            echo "qemu=$qemu"
            echo "buildx=$buildx"
          } >> "$GITHUB_OUTPUT"
          echo "Release scope: config=$config skip=$skip qemu=$qemu buildx=$buildx"

      # Docker setup for GoReleaser
      - name: Set up QEMU
        if: ${{ steps.scope.outputs.qemu == 'true' }}
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        if: ${{ steps.scope.outputs.buildx == 'true' }}
        uses: docker/setup-buildx-action@v3

      - name: Login to DockerHub
        if: ${{ steps.dockerhub.outputs.configured == 'true' }}
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Login to GitHub Container Registry
        if: ${{ env.PUBLISH_GHCR == 'true' }}
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Fetch tags with annotations
        run: |
          # 确保获取完整的 annotated tag 信息
          git fetch --tags --force

      - name: Get tag message
        id: tag_message
        env:
          RELEASE_TAG: ${{ needs.resolve_release_ref.outputs.release_tag }}
          EXPECTED_COMMIT_SHA: ${{ needs.resolve_release_ref.outputs.commit_sha }}
        run: |
          set -euo pipefail
          TAG_NAME="$RELEASE_TAG"
          echo "Processing tag: $TAG_NAME"

          # The tag may be force-moved while the workflow is queued. Verify the
          # fetched tag still names the immutable commit resolved by the first
          # job before consuming its metadata or invoking GoReleaser.
          actual_commit_sha="$(git rev-parse --verify --end-of-options "refs/tags/$TAG_NAME^{commit}")"
          if [[ "$actual_commit_sha" != "$EXPECTED_COMMIT_SHA" ]]; then
            echo "::error::Tag moved during release: expected $EXPECTED_COMMIT_SHA, got $actual_commit_sha"
            exit 1
          fi

          # 更新说明优先级：
          #   1. docs/release-notes/<tag>.md —— 仓库内的发版说明，可评审、可回看
          #   2. tag message body —— 兼容没有说明文件的旧 tag
          # 两者都为空时直接失败，避免再发出一个没有说明的 release。
          TAG_REF="refs/tags/$TAG_NAME"
          NOTES_FILE="docs/release-notes/${TAG_NAME}.md"
          if [[ -f "$NOTES_FILE" ]]; then
            TAG_MESSAGE="$(cat "$NOTES_FILE")"
            echo "Using release notes from $NOTES_FILE (${#TAG_MESSAGE} chars)"
          else
            TAG_MESSAGE="$(git for-each-ref --format='%(contents:body)' "$TAG_REF")"
            echo "No $NOTES_FILE; falling back to tag message (${#TAG_MESSAGE} chars)"
          fi
          if [[ -z "${TAG_MESSAGE//[[:space:]]/}" ]]; then
            echo "::error::No release notes. Add docs/release-notes/${TAG_NAME}.md or a non-empty annotated tag message."
            exit 1
          fi

          # Keep untrusted release notes out of workflow-command logs.
          echo "Tag message length: ${#TAG_MESSAGE}"

          # Use a random delimiter and verify it is absent from the message.
          # A fixed EOF delimiter lets tag authors inject extra GITHUB_OUTPUT
          # records (and is therefore not safe for workflow_dispatch releases).
          while :; do
            delimiter="gha_tag_message_$(openssl rand -hex 32)"
            if ! grep -Fqx -- "$delimiter" <<< "$TAG_MESSAGE"; then
              break
            fi
          done
          {
            printf 'message<<%s\n' "$delimiter"
            printf '%s\n' "$TAG_MESSAGE"
            printf '%s\n' "$delimiter"
          } >> "$GITHUB_OUTPUT"

      - name: Set lowercase owner for GHCR
        id: lowercase
        env:
          REPOSITORY_OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          owner="$(printf '%s' "$REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')"
          printf 'owner=%s\n' "$owner" >> "$GITHUB_OUTPUT"

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          version: '~> v2'
          args: release --clean --skip=${{ steps.scope.outputs.skip }} --config=${{ steps.scope.outputs.config }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_MESSAGE: ${{ steps.tag_message.outputs.message }}
          GITHUB_REPO_OWNER: ${{ github.repository_owner }}
          GITHUB_REPO_OWNER_LOWER: ${{ steps.lowercase.outputs.owner }}
          GITHUB_REPO_NAME: ${{ github.event.repository.name }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME || 'skip' }}

      # Update DockerHub description
      - name: Update DockerHub description
        if: ${{ env.SIMPLE_RELEASE != 'true' && steps.dockerhub.outputs.configured == 'true' }}
        uses: peter-evans/dockerhub-description@v5
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ secrets.DOCKERHUB_USERNAME }}/sub2api
          short-description: "Sub2API - AI API Gateway Platform"
          readme-filepath: ./deploy/DOCKER.md

      # Send Telegram notification
      - name: Send Telegram Notification
        if: ${{ env.SIMPLE_RELEASE != 'true' }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          RELEASE_TAG: ${{ needs.resolve_release_ref.outputs.release_tag }}
          REPOSITORY: ${{ github.repository }}
          TAG_MESSAGE: ${{ steps.tag_message.outputs.message }}
        continue-on-error: true
        run: |
          set -euo pipefail
          # 检查必要的环境变量
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "Telegram credentials not configured, skipping notification"
            exit 0
          fi

          TAG_NAME="$RELEASE_TAG"
          VERSION=${TAG_NAME#v}
          REPO="$REPOSITORY"
          GHCR_IMAGE="ghcr.io/${REPO,,}"  # ${,,} converts to lowercase

          # 获取 tag message 内容并转义 Markdown 特殊字符
          TAG_MESSAGE="$(printf '%s' "$TAG_MESSAGE" | sed 's/\([_*`\[]\)/\\\1/g')"

          # 限制消息长度（Telegram 消息限制 4096 字符，预留空间给头尾固定内容）
          if [ ${#TAG_MESSAGE} -gt 3500 ]; then
            TAG_MESSAGE="${TAG_MESSAGE:0:3500}..."
          fi

          # 构建消息内容
          MESSAGE="🚀 *Sub2API 新版本发布！*"$'\n'$'\n'
          MESSAGE+="📦 版本号: \`${VERSION}\`"$'\n'$'\n'

          # 添加更新内容
          if [ -n "$TAG_MESSAGE" ]; then
            MESSAGE+="${TAG_MESSAGE}"$'\n'$'\n'
          fi

          MESSAGE+="🐳 *Docker 部署:*"$'\n'
          MESSAGE+="\`\`\`bash"$'\n'
          # 根据是否配置 DockerHub 动态生成
          if [ -n "$DOCKERHUB_USERNAME" ]; then
            DOCKER_IMAGE="${DOCKERHUB_USERNAME}/sub2api"
            MESSAGE+="# Docker Hub"$'\n'
            MESSAGE+="docker pull ${DOCKER_IMAGE}:${VERSION}"$'\n'
            MESSAGE+="# GitHub Container Registry"$'\n'
          fi
          MESSAGE+="docker pull ${GHCR_IMAGE}:${VERSION}"$'\n'
          MESSAGE+="\`\`\`"$'\n'$'\n'
          MESSAGE+="🔗 *相关链接:*"$'\n'
          MESSAGE+="• [GitHub Release](https://github.com/${REPO}/releases/tag/${TAG_NAME})"$'\n'
          if [ -n "$DOCKERHUB_USERNAME" ]; then
            MESSAGE+="• [Docker Hub](https://hub.docker.com/r/${DOCKER_IMAGE})"$'\n'
          fi
          MESSAGE+="• [GitHub Packages](https://github.com/${REPO}/pkgs/container/sub2api)"$'\n'$'\n'
          MESSAGE+="#Sub2API #Release #${TAG_NAME//./_}"

          # 发送消息
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -H "Content-Type: application/json" \
            -d "$(jq -n \
              --arg chat_id "${TELEGRAM_CHAT_ID}" \
              --arg text "${MESSAGE}" \
              '{
                chat_id: $chat_id,
                text: $text,
                parse_mode: "Markdown",
                disable_web_page_preview: true
              }')"

  sync-version-file:
    needs: [resolve_release_ref, release]
    if: ${{ needs.release.result == 'success' && needs.resolve_release_ref.result == 'success' && (github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && startsWith(github.ref_name, 'v')) || (github.event_name == 'create' && github.event.ref_type == 'tag' && startsWith(github.event.ref, 'v'))) }}
    permissions:
      # This maintenance job commits the released VERSION to the default branch.
      contents: write
    runs-on: ubuntu-latest
    steps:
      # This maintenance job intentionally targets the default branch; it does
      # not contribute files to the release artifacts produced above.
      - name: Checkout default branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Sync VERSION file to released tag
        env:
          RELEASE_TAG: ${{ needs.resolve_release_ref.outputs.release_tag }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          VERSION="$RELEASE_TAG"
          VERSION=${VERSION#v}

          CURRENT_VERSION=$(tr -d '\r\n' < backend/cmd/server/VERSION || true)
          if [ "$CURRENT_VERSION" = "$VERSION" ]; then
            echo "VERSION file already matches $VERSION"
            exit 0
          fi

          echo "$VERSION" > backend/cmd/server/VERSION

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/cmd/server/VERSION
          git commit -m "chore: sync VERSION to ${VERSION} [skip ci]"
          git push origin "HEAD:${DEFAULT_BRANCH}"
