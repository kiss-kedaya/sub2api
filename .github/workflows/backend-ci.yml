name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # A run on main is never cancelled: cache-prime has to finish and save.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:

  # Decides whether the Go test jobs are needed. Only pull requests are
  # filtered: pushes to main and manual runs always run everything.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      backend: ${{ steps.classify.outputs.backend }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 2
      - name: Classify changed paths
        id: classify
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" != pull_request ]; then
            echo "backend=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # actions/checkout checks out the PR merge commit; its first parent is the base tip.
          if [ "$(git rev-list --parents -n 1 HEAD | wc -w)" -ne 3 ]; then
            echo "HEAD is not a merge commit, running everything"
            echo "backend=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git diff --name-only --no-renames HEAD^1 HEAD | bash .github/ci/changed-paths.sh | tee -a "$GITHUB_OUTPUT"

  account-timer-integration:
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: account_timer_review
          POSTGRES_DB: schedulable_timer_fixture
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 127.0.0.1:15440:5432
        options: >-
          --health-cmd "pg_isready -U account_timer_review -d schedulable_timer_fixture"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/go-cache
      - name: Warm compile (best effort)
        continue-on-error: true
        run: python3 .github/ci/warm-go.py --workflow .github/workflows/backend-ci.yml --jobs account-timer-integration --timeout 1500
      - name: Durable account schedule PostgreSQL 15 regression
        working-directory: backend
        env:
          ACCOUNT_TIMER_TEST_DSN: postgres://account_timer_review@127.0.0.1:15440/schedulable_timer_fixture?sslmode=disable
        run: go test -race -p 1 -tags=integration ./internal/accounttimer -count=1

  operator-storage-integration:
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/go-cache
      - name: Warm compile (best effort)
        continue-on-error: true
        run: python3 .github/ci/warm-go.py --workflow .github/workflows/backend-ci.yml --jobs operator-storage-integration --timeout 1500
      - name: Operator lease and credential state PostgreSQL regression
        working-directory: backend
        run: go test -race -p 1 -tags=integration ./internal/repository -run '^Test(CredentialGuardRepository|OAuthAdmissionCAS)' -count=1
      - name: Capture request ID filters PostgreSQL 15 regression
        working-directory: backend
        env:
          SUB2API_TEST_POSTGRES_IMAGE: postgres:15-alpine
        run: go test -race -p 1 -tags=integration ./internal/repository -run '^TestRequestCaptureSQLStore' -count=1

  deepseek-native-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/go-cache
      - name: Warm compile (best effort)
        continue-on-error: true
        run: python3 .github/ci/warm-go.py --workflow .github/workflows/backend-ci.yml --jobs deepseek-native-replay --timeout 1500
      - name: Native DeepSeek reasoning replay and tenant isolation
        working-directory: backend
        run: |
          go test -race -p 1 -tags=unit ./internal/service -run '^Test(DeepSeekNative|NormalizeDeepSeekResponsesRequestBody|RewriteInboundDeepSeekCallIDs|AdaptiveProtocolRoutesDeepSeek|ForwardResponses_ChatFallback)' -count=1
          go test -race -p 1 ./internal/pkg/apicompat -count=1

  copilot-adapter:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Prepare pinned public adapter
        run: bash deploy/copilot-sdk/prepare.sh "$RUNNER_TEMP/copilot-adapter"
      - name: Test authenticated tenant and tool contracts without network calls
        run: |
          "$RUNNER_TEMP/copilot-adapter/.venv/bin/python" -m pip install pytest pytest-asyncio pytest-socket
          PYTHONPATH="$RUNNER_TEMP/copilot-adapter" "$RUNNER_TEMP/copilot-adapter/.venv/bin/python" -m pytest --disable-socket --allow-unix-socket -q deploy/copilot-sdk/test_server.py deploy/copilot-sdk/test_adapter_contract.py

  client-error-privacy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/go-cache
      - name: Warm compile (best effort)
        continue-on-error: true
        run: python3 .github/ci/warm-go.py --workflow .github/workflows/backend-ci.yml --jobs client-error-privacy --timeout 1500
      - name: Client error privacy and protocol regression
        working-directory: backend
        run: |
          go test -race ./internal/util/clientprivacy ./internal/util/responseheaders -count=1
          go test -race -p 1 -tags=unit ./internal/service -run '^Test(ClientErrorPrivacy|DeepSeekDirectTransportCooldown|WSHTTPBridgeClientErrorPrivacy|ForwardWSV2ClientErrorPrivacy|ToUserErrorRequest|AnthropicPassthroughForwardStreamErrors|ForwardDeepSeekTools|ForwardAlphaSearch)' -count=1

  shell:
    runs-on: macos-15-intel
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - name: Check deployment scripts
        run: |
          /bin/bash -n deploy/apple-container.sh
          /bin/bash deploy/tests/apple-container-test.sh
          /bin/sh deploy/tests/docker-compose-security-test.sh
          /bin/sh deploy/tests/docker-compose-gateway-env-test.sh
          /bin/sh deploy/tests/docker-runtime-resources-test.sh
          /bin/sh deploy/test-caddyfile-cache.sh

  test-unit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/go-cache
      - name: Verify Go version
        run: |
          go version | grep -q 'go1.26.10'
      - name: Unit tests
        working-directory: backend
        run: make test-unit

  test-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/go-cache
      - name: Verify Go version
        run: |
          go version | grep -q 'go1.26.10'
      - name: Integration tests
        working-directory: backend
        run: make test-integration

  test-race-a:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/go-cache
      - name: Warm compile (best effort)
        continue-on-error: true
        run: python3 .github/ci/warm-go.py --workflow .github/workflows/backend-ci.yml --jobs test-race-a --timeout 1500
      - name: Verify Go version
        run: |
          go version | grep -q 'go1.26.10'
      - name: Wallet security concurrency regression
        working-directory: backend
        run: go test -race -p 1 ./internal/cryptopay/... ./internal/notify/... -count=1
      - name: Diagnostic and operator feature concurrency regression
        working-directory: backend
        run: |
          go test -race -p 1 ./internal/requestcapture ./internal/pkg/requesttiming ./internal/util/transportdiag ./internal/accounttimer ./internal/handler/admin/accounttimerapi ./internal/iprisk ./internal/handler/trafficquery -count=1
          go test -race -p 1 -tags=unit ./internal/server/middleware ./internal/service ./internal/handler/admin -run 'Test(Capture|RequestCapture|ConnectionDiagnostics|Anonymous|.*IPRisk|.*ContentModerationCategor|.*Traffic|.*SchedulableTimer)' -count=1

  test-race-b:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/go-cache
      - name: Warm compile (best effort)
        continue-on-error: true
        run: python3 .github/ci/warm-go.py --workflow .github/workflows/backend-ci.yml --jobs test-race-b --timeout 1500
      - name: Verify Go version
        run: |
          go version | grep -q 'go1.26.10'
      - name: Explicit cache and operations safety regression
        working-directory: backend
        run: |
          go test -race -p 1 ./internal/mihomo -count=1
          go test -race -p 1 -tags=unit ./internal/service ./internal/handler ./internal/handler/admin ./internal/repository ./cmd/server -run '^Test(GeminiCached|GeminiExplicit|GeminiCache|FixedCharge|AccountOps|ChannelOperations|CredentialGuard|ManagedProxy|ManagedAccount|APIKeyQueue|APIKeySlot|APIKeyAdmission|LiveLease|ProvideCleanup)' -count=1
      - name: Provider and automation regression
        working-directory: backend
        run: |
          go test -race -p 1 ./internal/localreasoning ./internal/serverless ./internal/service/basispoints -count=1
          go test -race -p 1 -tags=unit ./internal/service ./internal/handler ./internal/handler/admin ./internal/repository -run '^Test(CopilotSDK|Excel|Seedance|MiniMaxH3|VideoProvider|Automation|OpsAutomation|LocalReasoning|APIKeyAuthSnapshot.*Concurrency)' -count=1
      - name: Layered security admission and privacy regression
        working-directory: backend
        run: go test -race -p 1 -tags=unit ./internal/service ./internal/handler ./internal/securityaudit -run '^Test(SecurityPenalty|SecurityAudit.*Constraint|SecurityAuditRejectsUnbound|Penalty|PromptPenalty|RegistrationEmailAlias)' -count=1
      - name: Stream delivery and fixed tool billing concurrency regression
        working-directory: backend
        run: go test -race -p 1 -tags=unit ./internal/service ./internal/handler ./internal/repository ./internal/handler/dto -run '^Test(AnthropicPassthrough|GatewayService_AnthropicAPIKeyPassthrough_StreamError|GatewayHandlerMessagesPassthroughStreamFailure|GatewayBridgePreservesFixedToolBilling|GatewayForwardErrorAlreadyCommunicated|UpstreamErrorFrameReader|DeepSeekStandaloneToolFees|DeepSeekFixed|DeepSeekHostedUsageRecord|DeepSeekHostedSearchAndFetchMark|UsageFailure)' -count=1

  test-race-c:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/go-cache
      - name: Warm compile (best effort)
        continue-on-error: true
        run: python3 .github/ci/warm-go.py --workflow .github/workflows/backend-ci.yml --jobs test-race-c --timeout 1500
      - name: Verify Go version
        run: |
          go version | grep -q 'go1.26.10'
      - name: Codex ticket concurrency regression
        working-directory: backend
        run: go test -race -tags=unit ./internal/service -run 'Test.*CodexTicket' -count=1
      - name: Custom usage and upstream error concurrency regression
        working-directory: backend
        run: go test -race -p 1 -tags=unit ./internal/service ./internal/handler ./internal/handler/admin ./internal/repository -run 'Test(CustomUsage|CrossCustomUsage|AccountCustomUsage|.*UpstreamFinancial|.*FinancialError|.*FinancialStream)' -count=1
      - name: Routing affinity concurrency regression
        working-directory: backend
        run: go test -race -p 1 -tags=unit ./internal/service ./internal/repository -run 'Test(UpstreamPreferences|UpstreamAffinity|FailedAffinity)' -count=1
      - name: Anthropic converted cache regression
        working-directory: backend
        run: go test -race -p 1 -tags=unit ./internal/pkg/apicompat ./internal/service -run 'Test(AnthropicUsagePresence|ChatAnthropicCacheControl|ResponsesAnthropicCacheControl|ConvertedAnthropic|NativeAnthropicCachePolicy)' -count=1
      - name: Requested response model concurrency regression
        working-directory: backend
        run: go test -race -p 1 -tags=unit ./internal/service ./internal/handler ./internal/repository -run '^Test(RequestedModel|RewriteRequestedModel|ContextShouldReturnRequestedModel|GrokRealtimeRequestedModel|OpenAIWSPassthroughRequestedSession|LiveCallRequestedModel|LiveModelPresentation|LiveSidebandRequestedModel)' -count=1
      - name: DeepSeek search configuration and hosted tool regression
        working-directory: backend
        run: go test -race -p 1 -tags=unit ./internal/service ./internal/handler -run '^Test(APIKey.*(SearchProvider|ProviderSnapshot)|PrepareDeepSeek|DeepSeekHosted|ForwardDeepSeekTools|HasIndependentDeepSeek)' -count=1
      - name: Key-level DeepSeek tool injection regression
        working-directory: backend
        run: go test -race -p 1 -tags=unit ./internal/service ./internal/handler ./internal/handler/dto -run 'Test.*DeepSeekToolInjection|TestAPIKeyService_RejectsV25' -count=1
      - name: Billing and media concurrency regression
        working-directory: backend
        run: go test -race -p 1 -tags=unit ./internal/handler ./internal/service ./internal/repository -run 'Test(CNBalancePushNotifierConcurrent|GrokVideoDurable|MediaBilling|AsyncImage|ImageTask|OpenAIResponsesWebSocket.*(Balance|Subscription|Settlement)|SmartBilling|.*Refund.*Pending)' -count=1
      - name: Payment verification grant security regression
        working-directory: backend
        run: go test -race -p 1 -tags=unit ./internal/service ./internal/repository ./internal/server/routes ./internal/server/middleware -run 'Test(CryptoGrant|CryptoVerificationGrant|.*Crypto.*Grant)' -count=1
      - name: Ordered wallet outbox concurrency regression
        working-directory: backend
        run: go test -race -p 1 -tags=unit ./internal/service ./internal/repository -run '^Test(LiveBalanceAdjustmentOutbox|AdjustLiveBalance.*Batch|ApplyExternalBalanceOutbox|RecoveringLiveBalanceAdjustment)' -count=1
      - name: Inflight display and unlimited user concurrency regression
        working-directory: backend
        run: go test -race -p 1 -tags=unit ./internal/service ./internal/repository ./internal/handler ./internal/handler/dto ./internal/handler/admin ./internal/server/middleware -run '^Test(UsageInflight|TrackUsageInflight|UsageLogFromInflight|SetOpsSelectedAccount|IndependentInflight|AcquireUserSlot_ConcurrencyLimits|UserConcurrency|LiveLease)' -count=1

  # One stable check for the whole Go test suite. The test-* jobs run in
  # parallel; this job fails unless every one of them passed, or all were
  # skipped because only frontend/docs/markdown files changed.
  test:
    needs: [changes, test-unit, test-integration, test-race-a, test-race-b, test-race-c]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every Go test job
        env:
          CHANGES: ${{ needs.changes.result }}
          BACKEND: ${{ needs.changes.outputs.backend }}
          R_UNIT: ${{ needs.test-unit.result }}
          R_INTEGRATION: ${{ needs.test-integration.result }}
          R_RACE_A: ${{ needs.test-race-a.result }}
          R_RACE_B: ${{ needs.test-race-b.result }}
          R_RACE_C: ${{ needs.test-race-c.result }}
        run: |
          set -euo pipefail
          if [ "$CHANGES" != success ]; then
            echo "change detection: $CHANGES"
            exit 1
          fi
          want=success
          [ "$BACKEND" = true ] || want=skipped
          bad=0
          for pair in unit:"$R_UNIT" integration:"$R_INTEGRATION" race-a:"$R_RACE_A" race-b:"$R_RACE_B" race-c:"$R_RACE_C"; do
            if [ "${pair#*:}" != "$want" ]; then
              echo "test-${pair%%:*}: ${pair#*:} (expected $want)"
              bad=1
            fi
          done
          exit "$bad"

  crypto-sweep-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: crypto_review
          POSTGRES_DB: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 127.0.0.1:15439:5432
        options: >-
          --health-cmd "pg_isready -U crypto_review -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/go-cache
      - name: Durable sweep transactions against disposable PostgreSQL
        working-directory: backend
        env:
          CRYPTO_SWEEP_TEST_DSN: postgres://crypto_review@127.0.0.1:15439/postgres?sslmode=disable
        run: go test -tags=integration ./internal/cryptopay ./internal/cryptopay/sweeper -run '^TestPostgres' -count=1

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - uses: actions/checkout@v6
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24.22'
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile
      - name: Frontend typecheck and critical vitest
        run: make test-frontend
      - name: Operator feature frontend regression
        working-directory: frontend
        run: pnpm exec vitest run src/api/__tests__/groupCacheTest.spec.ts src/views/admin/__tests__/GroupCacheTestView.spec.ts src/components/account/__tests__/SchedulableTimerControl.spec.ts src/components/usage/__tests__/TrafficPanel.spec.ts src/components/account/__tests__/geminiCacheSettings.spec.ts src/components/admin/operations/__tests__ src/components/group/__tests__ src/views/admin/__tests__/OpsAutomationView.spec.ts src/views/admin/__tests__/ServerlessView.spec.ts src/views/admin/__tests__/AccountOpsView.spec.ts src/views/admin/__tests__/ChannelOperationsView.spec.ts src/views/admin/__tests__/RequestCaptureDiagnostics.spec.ts
      - name: Verify production frontend build
        working-directory: frontend
        run: pnpm run build
      # The SPA is the only supported frontend: one static bundle embedded into
      # the Go binary. Assert the deploy contract here so a broken fallback or a
      # stray SSR reference fails before the tag, not after.
      - name: Verify SPA deploy contract
        run: |
          node --test deploy/spa/verify-spa-bundle.test.mjs
          node deploy/spa/verify-spa-bundle.mjs frontend backend/internal/web/dist
      - name: Upload frontend for embedded build
        uses: actions/upload-artifact@v7
        with:
          name: ci-frontend-dist
          path: backend/internal/web/dist/
          if-no-files-found: error
          retention-days: 7
      # 原先这里逐个 python3 执行 deploy/rollout/test_rollout329..336_guard.py。
      # 这些脚本从未被 git 跟踪（它们只存在于 .artifacts/，而 .artifacts/ 在
      # .gitignore 里），CI 的干净检出上根本不存在对应文件，于是这一步自 2026-09-27
      # 起每次都以 "No such file or directory" 失败，把整个 CI 拖红。
      # 其中 329~332、334~336 连本地 .artifacts/ 里都没有。
      # 需要这些守卫回归进 CI，先把脚本提交到未被忽略的目录（如 deploy/tests/），
      # 再在这里按实际路径调用。

  build:
    needs: frontend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/go-cache
      - name: Download tested frontend
        uses: actions/download-artifact@v8
        with:
          name: ci-frontend-dist
          path: backend/internal/web/dist/
      - name: Verify embedded frontend
        working-directory: backend
        run: go test -tags=embed ./internal/web -count=1
      - name: Build embedded Linux binary
        working-directory: backend
        run: make build
      - name: Upload Linux binary
        uses: actions/upload-artifact@v7
        with:
          name: ci-linux-amd64
          path: backend/bin/server
          if-no-files-found: error
          retention-days: 7

  deepseek-search-probe:
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/fix/deepseek-search-provider'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/go-cache
      - name: Compile opt-in live search verification
        working-directory: backend
        env:
          CGO_ENABLED: '0'
        run: go test -c -tags=unit -o bin/deepseek-search-probe ./internal/service
      - name: Verify search behavior before publishing probe
        working-directory: backend
        run: bin/deepseek-search-probe -test.run='^Test(APIKey.*(SearchProvider|ProviderSnapshot)|PrepareDeepSeek|DeepSeekHosted|ForwardDeepSeekTools|HasIndependentDeepSeek)' -test.count=1
      - uses: actions/upload-artifact@v7
        with:
          name: deepseek-search-probe-linux-amd64
          path: backend/bin/deepseek-search-probe
          if-no-files-found: error
          retention-days: 3

  golangci-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/go-cache
      - name: Verify Go version
        run: |
          go version | grep -q 'go1.26.10'
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13
          args: --timeout=30m
          skip-save-cache: ${{ github.event_name == 'pull_request' }}
          working-directory: backend

  # The only writer of the Go caches that every other job restores. Runs on
  # pushes to main only, next to the tests, and never fails the build.
  cache-prime:
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    continue-on-error: true
    steps:
      - uses: actions/checkout@v6
      - id: gocache
        uses: ./.github/actions/go-cache
      - name: Stub embedded dist
        run: |
          mkdir -p backend/internal/web/dist
          printf '<!doctype html><title>stub</title>' > backend/internal/web/dist/index.html
      # Go refreshes the timestamp of every entry it uses (at most once an
      # hour). Aging all entries first lets the prune step drop what this run
      # did not touch, so the cache follows the code instead of growing.
      - name: Age cache entries
        run: |
          dir="$(go env GOCACHE)"
          if [ -d "$dir" ]; then find "$dir" -type f -exec touch -d "2 hours ago" {} +; fi
      - name: Compile every CI test configuration
        run: python3 .github/ci/warm-go.py --workflow .github/workflows/backend-ci.yml --timeout 2400
      - name: Prune entries this run did not use
        run: |
          dir="$(go env GOCACHE)"
          before=$(du -sm "$dir" | cut -f1)
          find "$dir" -type f -not -newermt "90 minutes ago" -delete
          after=$(du -sm "$dir" | cut -f1)
          echo "GOCACHE pruned: ${before} MB -> ${after} MB" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Save module cache (exact miss only)
        if: ${{ steps.gocache.outputs.mod-hit != 'true' }}
        uses: actions/cache/save@v6
        with:
          path: ${{ steps.gocache.outputs.gomodcache }}
          key: ci-gomod-${{ runner.os }}-${{ hashFiles('backend/go.sum') }}
      - name: Save build cache
        uses: actions/cache/save@v6
        with:
          path: ${{ steps.gocache.outputs.gocache }}
          key: ci-gobuild-${{ runner.os }}-${{ steps.gocache.outputs.go-version }}-${{ github.sha }}

  # Keeps one cache per kind. Cache keys are immutable, so a rolling cache
  # needs the previous one removed. This job is the only one with
  # actions: write, runs on pushes to main only, and only touches keys that
  # start with ci-gobuild- or ci-gomod- (see .github/ci/gc-caches.sh).
  cache-gc:
    needs: cache-prime
    if: ${{ !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: write
      contents: read
    steps:
      - uses: actions/checkout@v6
      - name: Delete older Go caches
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: bash .github/ci/gc-caches.sh --apply ci-gobuild- ci-gomod-
