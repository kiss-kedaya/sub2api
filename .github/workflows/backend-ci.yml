name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  shell:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v6
      - name: Check deployment scripts
        run: |
          /bin/bash -n deploy/apple-container.sh
          /bin/bash deploy/tests/apple-container-test.sh
          /bin/sh deploy/tests/docker-compose-security-test.sh
          /bin/sh deploy/tests/docker-compose-gateway-env-test.sh
          /bin/sh deploy/tests/docker-runtime-resources-test.sh
          /bin/sh deploy/test-caddyfile-cache.sh

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          check-latest: false
          cache: true
          cache-dependency-path: backend/go.sum
      - name: Verify Go version
        run: |
          go version | grep -q 'go1.26.6'
      - name: Unit tests
        working-directory: backend
        run: make test-unit
      - name: Integration tests
        working-directory: backend
        run: make test-integration
      - name: Codex ticket concurrency regression
        working-directory: backend
        run: go test -race -tags=unit ./internal/service -run 'Test.*CodexTicket' -count=1
      - name: Custom usage and upstream error concurrency regression
        working-directory: backend
        run: go test -race -p 1 -tags=unit ./internal/service ./internal/handler ./internal/handler/admin -run 'Test(CustomUsage|.*UpstreamFinancial|.*FinancialError|.*FinancialStream)' -count=1
      - name: Billing and media concurrency regression
        working-directory: backend
        run: go test -race -p 1 -tags=unit ./internal/handler ./internal/service ./internal/repository -run 'Test(GrokVideoDurable|MediaBilling|AsyncImage|ImageTask|OpenAIResponsesWebSocket.*(Balance|Subscription|Settlement)|SmartBilling|.*Refund.*Pending)' -count=1

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile
      - name: Frontend typecheck and critical vitest
        run: make test-frontend
      - name: Verify production frontend build
        working-directory: frontend
        run: pnpm run build
      - name: Verify rollout rollback simulations
        run: |
          python3 deploy/rollout/test_rollout329_guard.py
          python3 deploy/rollout/test_rollout330_guard.py
          python3 deploy/rollout/test_rollout331_guard.py
          python3 deploy/rollout/test_rollout332_guard.py
          python3 deploy/rollout/test_rollout333_guard.py
          python3 deploy/rollout/test_rollout334_guard.py
          python3 deploy/rollout/test_rollout335_guard.py
          python3 deploy/rollout/test_rollout336_guard.py

  golangci-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          check-latest: false
          cache: true
          cache-dependency-path: backend/go.sum
      - name: Verify Go version
        run: |
          go version | grep -q 'go1.26.6'
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13
          args: --timeout=30m
          working-directory: backend
