name: ORM code generation

on:
  push:
    branches: [feat/ops-capabilities]
    paths:
      - backend/ent/schema/**
      - .github/workflows/orm-codegen.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Generate Ent from committed schema
        working-directory: backend
        run: go generate ./ent
      - name: Export generated source
        run: tar -czf generated-ent.tar.gz backend/ent
      - uses: actions/upload-artifact@v7
        with:
          name: generated-ent
          path: generated-ent.tar.gz
          retention-days: 3
