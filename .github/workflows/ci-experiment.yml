      - name: "Warm twin 2: go test -race -exec true -count=1 ./internal/cryptopay/... ./internal/"
        continue-on-error: true
        working-directory: backend
        env:
          GOFLAGS: -debug-actiongraph=${{ runner.temp }}/ag/warm-2.json
        run: go test -race -exec true -count=1 ./internal/cryptopay/... ./internal/notify/... ./internal/requestcapture ./internal/pkg/requesttiming ./internal/util/transportdiag ./internal/accounttimer ./internal/handler/admin/accounttimerapi ./internal/iprisk ./internal/handler/trafficquery
      - name: "warmexec S5 wallet (cryptopay+notify)"
