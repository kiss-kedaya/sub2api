  g-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      - id: gocache
        uses: ./.github/actions/go-cache
        with:
          key-prefix: exp
      - name: "Prepare action graph dir"
        run: mkdir -p "$RUNNER_TEMP/ag"
      - name: "Cache state after restore"
        run: |
          echo "mod-hit=${{ steps.gocache.outputs.mod-hit }} build-matched='${{ steps.gocache.outputs.build-matched-key }}'"
          for d in "$(go env GOCACHE)" "$(go env GOMODCACHE)"; do
            echo "$d: $(du -sm "$d" 2>/dev/null | cut -f1) MB, $(find "$d" -type f 2>/dev/null | wc -l) files"
          done
      - name: "Experiment delta (never committed)"
        run: bash .github/ci/exp-delta.sh
      - name: Verify Go version
        run: |
          go version | grep -q 'go1.26.10'
      - name: "Warm compile (best effort)"
        continue-on-error: true
        run: python3 .github/ci/warm-go.py --workflow .github/workflows/ci-experiment.yml --jobs g-replay --ag-dir "$RUNNER_TEMP/ag" --timeout 1500
      - name: Native DeepSeek reasoning replay and tenant isolation
        working-directory: backend
        run: |
          go test -race -p 1 -tags=unit ./internal/service -run '^Test(DeepSeekNative|NormalizeDeepSeekResponsesRequestBody|RewriteInboundDeepSeekCallIDs|AdaptiveProtocolRoutesDeepSeek|ForwardResponses_ChatFallback)' -count=1
          go test -race -p 1 ./internal/pkg/apicompat -count=1
      - name: "Action graph summary"
