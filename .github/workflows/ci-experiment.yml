# EXPERIMENT ONLY - do not merge. Measures CI speed-up hypotheses in one run.
# It only reacts to changes of its own files, so it never mixes with CI.
name: CI experiment

on:
  pull_request:
    paths:
      - .github/workflows/ci-experiment.yml
      - .github/actions/go-cache/**
      - .github/ci/**
      - .goreleaser*.yaml

concurrency:
  group: ci-experiment-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  x0-base:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          check-latest: false
          cache: true
          cache-dependency-path: backend/go.sum
      - name: "Prepare action graph dir"
        run: mkdir -p "$RUNNER_TEMP/ag"
      - name: "cold S5 wallet (cryptopay+notify)"
        working-directory: backend
        env:
          GOFLAGS: -debug-actiongraph=${{ runner.temp }}/ag/cold-s5.json
        run: go test -race -p 1 ./internal/cryptopay/... ./internal/notify/... -count=1
      - name: "cold S6a diagnostic untagged"
        working-directory: backend
        env:
          GOFLAGS: -debug-actiongraph=${{ runner.temp }}/ag/cold-s6a.json
        run: go test -race -p 1 ./internal/requestcapture ./internal/pkg/requesttiming ./internal/util/transportdiag ./internal/accounttimer ./internal/handler/admin/accounttimerapi ./internal/iprisk ./internal/handler/trafficquery -count=1
      - name: "cold S6b diagnostic unit-tag"
        working-directory: backend
        env:
          GOFLAGS: -debug-actiongraph=${{ runner.temp }}/ag/cold-s6b.json
        run: go test -race -p 1 -tags=unit ./internal/server/middleware ./internal/service ./internal/handler/admin -run 'Test(Capture|RequestCapture|ConnectionDiagnostics|Anonymous|.*IPRisk|.*ContentModerationCategor|.*Traffic|.*SchedulableTimer)' -count=1
      - name: "Action graph summary"
        if: always()
        run: python3 .github/ci/ag-summary.py "x0 baseline cold" "$RUNNER_TEMP"/ag/*.json | tee -a "$GITHUB_STEP_SUMMARY"

  x1a-warm-build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          check-latest: false
          cache: true
          cache-dependency-path: backend/go.sum
      - name: "Prepare action graph dir"
        run: mkdir -p "$RUNNER_TEMP/ag"
      - name: "Warm: go build -race ./..."
        continue-on-error: true
        working-directory: backend
        env:
          GOFLAGS: -debug-actiongraph=${{ runner.temp }}/ag/warm-build.json
        run: go build -race ./...
      - name: "warmbuild S5 wallet (cryptopay+notify)"
        working-directory: backend
        env:
          GOFLAGS: -debug-actiongraph=${{ runner.temp }}/ag/warmbuild-s5.json
        run: go test -race -p 1 ./internal/cryptopay/... ./internal/notify/... -count=1
      - name: "warmbuild S6a diagnostic untagged"
        working-directory: backend
        env:
          GOFLAGS: -debug-actiongraph=${{ runner.temp }}/ag/warmbuild-s6a.json
        run: go test -race -p 1 ./internal/requestcapture ./internal/pkg/requesttiming ./internal/util/transportdiag ./internal/accounttimer ./internal/handler/admin/accounttimerapi ./internal/iprisk ./internal/handler/trafficquery -count=1
      - name: "warmbuild S6b diagnostic unit-tag"
        working-directory: backend
        env:
          GOFLAGS: -debug-actiongraph=${{ runner.temp }}/ag/warmbuild-s6b.json
        run: go test -race -p 1 -tags=unit ./internal/server/middleware ./internal/service ./internal/handler/admin -run 'Test(Capture|RequestCapture|ConnectionDiagnostics|Anonymous|.*IPRisk|.*ContentModerationCategor|.*Traffic|.*SchedulableTimer)' -count=1
      - name: "Probe S6b again (plain)"
        working-directory: backend
        env:
          GOFLAGS: -debug-actiongraph=${{ runner.temp }}/ag/probe-plain.json
        run: go test -race -p 1 -tags=unit ./internal/server/middleware ./internal/service ./internal/handler/admin -run 'Test(Capture|RequestCapture|ConnectionDiagnostics|Anonymous|.*IPRisk|.*ContentModerationCategor|.*Traffic|.*SchedulableTimer)' -count=1
      - name: "Probe S6b again (-ldflags=-w)"
        working-directory: backend
        env:
          GOFLAGS: -ldflags=-w -debug-actiongraph=${{ runner.temp }}/ag/probe-ldw.json
        run: go test -race -p 1 -tags=unit ./internal/server/middleware ./internal/service ./internal/handler/admin -run 'Test(Capture|RequestCapture|ConnectionDiagnostics|Anonymous|.*IPRisk|.*ContentModerationCategor|.*Traffic|.*SchedulableTimer)' -count=1
      - name: "Action graph summary"
        if: always()
        run: python3 .github/ci/ag-summary.py "x1a warm build -race ./..." "$RUNNER_TEMP"/ag/*.json | tee -a "$GITHUB_STEP_SUMMARY"

