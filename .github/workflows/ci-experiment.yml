    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: fe-build
    steps:
      - uses: actions/checkout@v6
      - id: gocache
        uses: ./.github/actions/go-cache
        with:
          key-prefix: exp
      - name: "Cache state after restore"
        run: |
          echo "mod-hit=${{ steps.gocache.outputs.mod-hit }} build-matched='${{ steps.gocache.outputs.build-matched-key }}'"
          for d in "$(go env GOCACHE)" "$(go env GOMODCACHE)"; do
            echo "$d: $(du -sm "$d" 2>/dev/null | cut -f1) MB, $(find "$d" -type f 2>/dev/null | wc -l) files"
          done
      - name: "Experiment delta (never committed)"
        run: bash .github/ci/exp-delta.sh
      - name: "Download frontend dist"
        uses: actions/download-artifact@v8
        with:
          name: exp-frontend-dist
          path: backend/internal/web/dist/
      - name: Verify embedded frontend
        working-directory: backend
        run: go test -tags=embed ./internal/web -count=1
      - name: Build embedded Linux binary
        working-directory: backend
        run: make build
