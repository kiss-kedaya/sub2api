      - name: "Action graph summary"
        if: always()
        run: python3 .github/ci/ag-summary.py "x2 cold, -p 4" "$RUNNER_TEMP"/ag/*.json | tee -a "$GITHUB_STEP_SUMMARY"

  prime:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
      - id: gocache
        uses: ./.github/actions/go-cache
        with:
          key-prefix: exp
      - name: "Prepare action graph dir"
        run: mkdir -p "$RUNNER_TEMP/ag"
      - name: "Cache state after restore"
        run: |
          echo "mod-hit=${{ steps.gocache.outputs.mod-hit }} build-matched='${{ steps.gocache.outputs.build-matched-key }}'"
          for d in "$(go env GOCACHE)" "$(go env GOMODCACHE)"; do
            echo "$d: $(du -sm "$d" 2>/dev/null | cut -f1) MB, $(find "$d" -type f 2>/dev/null | wc -l) files"
          done
      - name: "Stub embedded dist"
        run: |
          mkdir -p backend/internal/web/dist
          printf '<!doctype html><title>stub</title>' > backend/internal/web/dist/index.html
      - name: "Age cache entries"
        run: |
          dir="$(go env GOCACHE)"
          if [ -d "$dir" ]; then find "$dir" -type f -exec touch -d "2 hours ago" {} +; fi
      - name: "Warm every CI build configuration"
        run: python3 .github/ci/warm-go.py --workflow .github/workflows/backend-ci.yml --ag-dir "$RUNNER_TEMP/ag" --timeout 2400
      - name: "Prune entries this run did not use"
        run: |
          dir="$(go env GOCACHE)"
          before=$(du -sm "$dir" | cut -f1)
          find "$dir" -type f -not -newermt "90 minutes ago" -delete
          after=$(du -sm "$dir" | cut -f1)
          echo "GOCACHE pruned: ${before} MB -> ${after} MB" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: "Cache state after prune"
        run: |
          echo "mod-hit=${{ steps.gocache.outputs.mod-hit }} build-matched='${{ steps.gocache.outputs.build-matched-key }}'"
          for d in "$(go env GOCACHE)" "$(go env GOMODCACHE)"; do
            echo "$d: $(du -sm "$d" 2>/dev/null | cut -f1) MB, $(find "$d" -type f 2>/dev/null | wc -l) files"
          done
      - name: "Action graph summary"
        if: always()
        run: python3 .github/ci/ag-summary.py "prime warm steps" "$RUNNER_TEMP"/ag/*.json | tee -a "$GITHUB_STEP_SUMMARY"
      - name: "Save module cache (exact miss only)"
        if: steps.gocache.outputs.mod-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ${{ steps.gocache.outputs.gomodcache }}
          key: exp-gomod-${{ runner.os }}-${{ hashFiles('backend/go.sum') }}
      - name: "Save build cache (no previous match only)"
        if: steps.gocache.outputs.build-matched-key == ''
        uses: actions/cache/save@v6
        with:
          path: ${{ steps.gocache.outputs.gocache }}
          key: exp-gobuild-${{ runner.os }}-${{ steps.gocache.outputs.go-version }}-${{ github.sha }}

