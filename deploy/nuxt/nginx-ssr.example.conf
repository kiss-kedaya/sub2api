# 参考模板，不是可直接替换的生产配置。
#
# 本次 502 的故障链是：
#   SSR 3118  --NUXT_BACKEND_ORIGIN-->  本地 dispatch 127.0.0.1:3187
#   dispatch  --硬编码单个 Go 后端-->   502
#
# 所以真正要 HA 的是 3187 dispatch 后面的 Go upstream，而不是只给外层
# nginx 配两个 Node slot。外层 Node 双 slot 仍然保留，但它不是这次根因修复。
#
# 两个 Go 后端必须同版（与 NUXT_EXPECTED_BACKEND_VERSION 一致），
# local primary + peer backup；两个 SSR slot 也必须同版。

# 外层 SSR upstream（可选；不是本次 3187 dispatch 根因修复）
upstream sub2api_bff {
    least_conn;

    server 127.0.0.1:3118 max_fails=2 fail_timeout=10s;
    server 127.0.0.1:3119 max_fails=2 fail_timeout=10s backup;

    keepalive 64;
}

# 3187 dispatch 的 Go upstream（本次根因修复）。
# 两个 server 必须是同一 Go 版本；peer 示例用 TEST-NET-1 文档地址，
# 生产必须换成真实 peer 内网 IP:端口。
upstream sub2api_go_bff {
    least_conn;

    # local primary
    server 127.0.0.1:8080 max_fails=2 fail_timeout=10s;

    # peer backup（示例占位；换成 peer 内网地址）
    server 192.0.2.10:8080 max_fails=2 fail_timeout=10s backup;

    keepalive 64;
}

# 外层入口：页面与 /api/v1/ 走 Node BFF，网关流量继续直连 Go。
server {
    listen 80;                 # 正式接入时按现网监听方式调整
    server_name _;

    # Gateway traffic must remain on Go. Put this before the SSR catch-all.
    # 生产还要保留 /v1beta/、/backend-api/、/antigravity/、/images/、/videos/、
    # /responses、/models、/messages 等全部网关前缀；这里只演示 /v1/。
    location ^~ /v1/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 600s;
        proxy_buffering off;
    }

    # 发布/监控探针：短超时、不写 access log。
    location = /health/frontend {
        proxy_pass http://sub2api_bff;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_connect_timeout 2s;
        proxy_read_timeout 5s;
        proxy_send_timeout 5s;
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_next_upstream_tries 2;
        access_log off;
    }

    # 管理 API：BFF 负责会话、CSRF 与固定上游。
    location = /api/v1 {
        proxy_pass http://sub2api_bff;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Public ingress overwrites client forwarding headers. With a WAF/CDN,
        # configure its exact trusted peers before using this example.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_connect_timeout 3s;
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
        proxy_buffering off;
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_next_upstream_tries 2;
        add_header Cache-Control "no-store" always;
    }

    location ^~ /api/v1/ {
        proxy_pass http://sub2api_bff;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_connect_timeout 3s;
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
        proxy_buffering off;
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_next_upstream_tries 2;
        add_header Cache-Control "no-store" always;
    }

    # 页面与静态资源。这个 catch-all 必须排在最后。
    location / {
        proxy_pass http://sub2api_bff;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_connect_timeout 3s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
        proxy_buffering off;
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_next_upstream_tries 2;
    }
}

# 3187 internal BFF dispatch：SSR 的 NUXT_BACKEND_ORIGIN 指向这里。
# 只监听 loopback，不接公网，不承接 /v1 网关流量。
# BFF 已清洗公网 Host / proto / 客户端 IP。3187 是 loopback，只信任 BFF 写入的
# forwarded 值：不要再用 $host / $scheme / $remote_addr 覆盖，否则 Go 的同源
# 校验和客户端 IP 限流会看到 127.0.0.1 / http。

server {
    listen 127.0.0.1:3187;
    server_name _;
    access_log off;

    # BFF 只把 /api/v1/** 发到 NUXT_BACKEND_ORIGIN。
    location = /api/v1 {
        proxy_pass http://sub2api_go_bff;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $http_x_forwarded_host;
        proxy_set_header X-Forwarded-Host $http_x_forwarded_host;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header X-Forwarded-For $http_x_forwarded_for;
        proxy_set_header X-Real-IP $http_x_real_ip;
        proxy_connect_timeout 3s;
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
        proxy_buffering off;
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_next_upstream_tries 2;
        add_header Cache-Control "no-store" always;
    }

    location ^~ /api/v1/ {
        proxy_pass http://sub2api_go_bff;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $http_x_forwarded_host;
        proxy_set_header X-Forwarded-Host $http_x_forwarded_host;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header X-Forwarded-For $http_x_forwarded_for;
        proxy_set_header X-Real-IP $http_x_real_ip;
        proxy_connect_timeout 3s;
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
        proxy_buffering off;
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_next_upstream_tries 2;
        add_header Cache-Control "no-store" always;
    }

    # proxy_next_upstream 故意不带 non_idempotent：GET/HEAD 可切到 peer，
    # 登录/提交类 POST 绝不重放。需要重试 POST 时不能只改这里，必须先确认
    # 业务幂等、CSRF 和会话语义。
}
