# 参考片段，不是可直接替换的生产配置。
# 目标：页面与 /api/v1/ 走 Node BFF，网关流量继续按现状直连 Go。

upstream sub2api_ssr {
    server 127.0.0.1:3000;
    keepalive 32;
}

server {
    listen 80;                 # 正式接入时按现网监听方式调整
    server_name _;

    # Gateway traffic must remain on Go. Put this before the SSR catch-all.
    location ^~ /v1/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 600s;
        proxy_buffering off;
    }

    # 管理 API：BFF 负责会话、CSRF 与固定上游
    location /api/v1/ {
        proxy_pass http://sub2api_ssr;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 180s;   # 与 Go 的报表超时一致
        proxy_buffering off;       # 管理 API 也可能有流式响应
        add_header Cache-Control "no-store" always;
    }

    # 页面与静态资源
    location / {
        proxy_pass http://sub2api_ssr;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # 网关流量：/v1/messages、/v1/responses、/v1/chat/completions、WS
    # 仍按现网配置直连 Go，不要指到 sub2api_ssr。
}
