# Included inside gateway location blocks. OPTIONS never reaches Go (empty
# cors.allowed_origins currently 403s preflight). Actual requests get ACAO.
if ($request_method = OPTIONS) {
    add_header Access-Control-Allow-Origin $api_cors_origin always;
    add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, HEAD, OPTIONS" always;
    add_header Access-Control-Allow-Headers "Authorization, Content-Type, Content-Length, Accept, Accept-Encoding, Origin, Cache-Control, X-Requested-With, X-API-Key, X-Api-Key, x-api-key, x-goog-api-key, anthropic-version, anthropic-beta, OpenAI-Beta, x-stainless-lang, x-stainless-package-version, x-stainless-os, x-stainless-arch, x-stainless-retry-count, x-stainless-runtime, x-stainless-runtime-version, x-stainless-async, x-stainless-helper-method, x-stainless-poll-helper, x-stainless-custom-poll-interval, x-stainless-timeout" always;
    add_header Access-Control-Max-Age 86400 always;
    add_header Vary Origin always;
    add_header Content-Length 0 always;
    return 204;
}
add_header Access-Control-Allow-Origin $api_cors_origin always;
add_header Access-Control-Expose-Headers "ETag, Server-Timing" always;
add_header Vary Origin always;
proxy_pass http://sub2api_prod;
