# Reference server block for the SPA-only frontend.
#
# The frontend is a static Vite bundle. There is no Node/Nitro runtime: /api/*
# and the gateway prefixes go straight to the Go binary, everything else falls
# back to index.html so client-side routes survive a refresh or a deep link.
#
# Order matters. nginx picks the most specific prefix, but `^~` beats a regex
# and `/` matches everything, so the API blocks must be included BEFORE the SPA
# location. Including them after is what turns API calls into HTML.
#
# What must NOT appear in this file:
#   - proxy_pass to a 311x / Nitro / Node upstream
#   - a bare `try_files $uri /index.html` without the API prefixes above it
#
# Copy alongside sub2api-backend-locations.conf and sub2api-spa.conf.

upstream sub2api_prod {
    # The binary serves both the API and, via -tags=embed, index.html itself.
    # Point this at a single business instance; nginx does the balancing.
    server 127.0.0.1:8080;
    keepalive 64;
}

server {
    listen 443 ssl;
    http2 on;
    server_name example.com;

    # ssl_certificate / ssl_certificate_key omitted: set them for the host.

    client_max_body_size 256m;

    # Long-lived hashed assets. Immutable is safe because the filename carries
    # the content hash; a new build produces new names.
    location ^~ /assets/ {
        root /opt/sub2api/ui;
        try_files $uri @sub2api_go;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
    }

    # API and gateway prefixes, straight to Go. Never fall back to index.html.
    include /etc/nginx/snippets/sub2api-backend-locations.conf;

    # Long-running streams: SSE and WebSocket must not be buffered.
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    proxy_read_timeout 180s;
    proxy_send_timeout 180s;

    # SPA entry: any non-API path that is not a real file becomes index.html.
    # index.html itself must never be cached, or a deploy leaves clients
    # pointing at asset hashes that no longer exist.
    location / {
        root /opt/sub2api/ui;
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-store" always;
    }

    location @sub2api_go {
        proxy_pass http://sub2api_prod;
    }

    # Runtime build identity for smoke tests; never cached.
    location = /frontend-build.json {
        root /opt/sub2api/ui;
        add_header Cache-Control "no-store" always;
    }
}
