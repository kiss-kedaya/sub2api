# Gateway paths: proxy to Go and attach browser CORS.
# Panel /api/ stays same-origin only (session cookies).

location ^~ /v1/ { include /etc/nginx/snippets/sub2api-cors-proxy.conf; }
location = /v1 { include /etc/nginx/snippets/sub2api-cors-proxy.conf; }

location ^~ /v1beta/ { include /etc/nginx/snippets/sub2api-cors-proxy.conf; }
location = /v1beta { include /etc/nginx/snippets/sub2api-cors-proxy.conf; }

location ^~ /backend-api/ { include /etc/nginx/snippets/sub2api-cors-proxy.conf; }
location ^~ /antigravity/ { include /etc/nginx/snippets/sub2api-cors-proxy.conf; }

location ^~ /images/ { include /etc/nginx/snippets/sub2api-cors-proxy.conf; }
location ^~ /videos/ { include /etc/nginx/snippets/sub2api-cors-proxy.conf; }
location ^~ /responses { include /etc/nginx/snippets/sub2api-cors-proxy.conf; }
location ^~ /models { include /etc/nginx/snippets/sub2api-cors-proxy.conf; }
location ^~ /messages { include /etc/nginx/snippets/sub2api-cors-proxy.conf; }
location ^~ /custom-voices { include /etc/nginx/snippets/sub2api-cors-proxy.conf; }

# OpenAI-compatible SDKs must use the documented /v1 base URL. A bare path
# otherwise falls through to the website login HTML and fails as a misleading 502.
location = /chat/completions {
    default_type application/json;
    return 400 '{"error":{"message":"This endpoint requires the /v1 prefix. Use /v1/chat/completions.","type":"invalid_request_error","code":"missing_v1_prefix"}}';
}
location = /embeddings { include /etc/nginx/snippets/sub2api-cors-proxy.conf; }
location = /alpha/search { include /etc/nginx/snippets/sub2api-cors-proxy.conf; }
location = /tts { include /etc/nginx/snippets/sub2api-cors-proxy.conf; }
location = /stt { include /etc/nginx/snippets/sub2api-cors-proxy.conf; }
location = /realtime { include /etc/nginx/snippets/sub2api-cors-proxy.conf; }
location = /web_search { include /etc/nginx/snippets/sub2api-cors-proxy.conf; }
location = /x_search { include /etc/nginx/snippets/sub2api-cors-proxy.conf; }

location ^~ /api/ { proxy_pass http://sub2api_prod; }
location ^~ /setup/ { proxy_pass http://sub2api_prod; }
location = /health { proxy_pass http://sub2api_prod; }
location = /readyz { proxy_pass http://sub2api_prod; }
