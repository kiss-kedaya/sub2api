# Same-origin Vue SPA (sidebar /infinite-canvas like /ip-allowlist).
# API prefixes are matched first via sub2api-backend-locations.conf.

location ^~ /assets/ {
    root /opt/sub2api/ui;
    try_files $uri @sub2api_go;
    expires 30d;
    add_header Cache-Control "public, max-age=2592000, immutable";
}

location @sub2api_go {
    proxy_pass http://sub2api_prod;
}

location / {
    root /opt/sub2api/ui;
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-store" always;
}
