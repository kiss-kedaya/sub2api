<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#dfeee8">
<title>鹈鹕的单车时光</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body {
    min-height: 100svh;
    display: grid;
    place-items: center;
    overflow-x: hidden;
    background: #dfeee8;
    color: #294c48;
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  main { width: min(1100px, 100%); padding: 28px 20px; }
  header { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 0 5%; }
  h1 { margin: 0; font-size: 25px; font-weight: 650; letter-spacing: 0; }
  .edition { font-size: 11px; color: #5a7972; }
  .scene { display: block; width: 100%; height: auto; overflow: hidden; }
  footer { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 0 5%; }
  .caption { font-size: 12px; color: #5a7972; }
  button {
    width: 42px; height: 42px; display: grid; place-items: center;
    border: 1px solid #aac4b9; border-radius: 50%;
    background: transparent; color: #294c48; cursor: pointer;
  }
  button:hover { background: #cfe2d7; }
  button:focus-visible { outline: 3px solid #d47b55; outline-offset: 4px; }
  button svg { width: 18px; height: 18px; }
  .play { display: none; }
  button[data-paused="true"] .pause { display: none; }
  button[data-paused="true"] .play { display: block; }
  @media (max-width: 540px) {
    main { padding: 24px 0; }
    h1 { font-size: 20px; }
    .edition { font-size: 10px; }
    .caption { font-size: 11px; }
    .scene { margin: 18px 0; }
  }
</style>
</head>
<body>
<main>

  <footer>
    <span class="caption">慢慢骑，沿着海岸线。</span>
    <button id="toggle" type="button" aria-label="暂停动画" title="暂停动画" data-paused="false">

        <g class="pause"><path d="M8 5V19M16 5V19"/></g>
        <path class="play" d="M8 5L19 12L8 19Z" fill="currentColor" stroke-linejoin="round"/>
      </svg>
    </button>
  </footer>
</main>
<script>
(() => {
  "use strict";
  const get = id => document.getElementById(id);
  const rear = get("rear-wheel");
  const front = get("front-wheel");
  const crank = get("crank");
  const rider = get("rider");
  const nearPath = get("near-leg-path");
  const nearHighlight = get("near-leg-highlight");
  const farPath = get("far-leg-path");
  const nearFoot = get("near-foot");
  const farFoot = get("far-foot");
  const scarf = get("scarf");
  const road = get("road-marks");
  const grasses = get("grasses");
  const clouds = get("clouds");
  const toggle = get("toggle");
  const reducedMotion = matchMedia("(prefers-reduced-motion: reduce)");
  let paused = reducedMotion.matches;
  let elapsed = 0;
  let previous = null;

  // Two-link inverse kinematics keeps both feet attached to their pedals.
  function leg(angle, bob, path, foot, highlight, far) {
    const hip = { x: far ? 447 : 457, y: 255 + bob };
    const pedal = {
      x: 479 + Math.cos(angle) * 34,
      y: 385 + Math.sin(angle) * 34
    };
    const ankle = { x: pedal.x - 3, y: pedal.y - 10 };
    const dx = ankle.x - hip.x;
    const dy = ankle.y - hip.y;
    const distance = Math.hypot(dx, dy);
    const upper = 87;
    const lower = 88;
    const along = (upper * upper - lower * lower + distance * distance) / (2 * distance);
    const height = Math.sqrt(Math.max(0, upper * upper - along * along));
    const knee = {
      x: hip.x + dx * along / distance + dy * height / distance,
      y: hip.y + dy * along / distance - dx * height / distance
    };
    const d = `M${hip.x} ${hip.y}L${knee.x} ${knee.y}L${ankle.x} ${ankle.y}`;
    path.setAttribute("d", d);
    if (highlight) highlight.setAttribute("d", d);
    foot.setAttribute("transform", `translate(${pedal.x} ${pedal.y - 10})`);
  }

  function render(time) {
    const angle = time * Math.PI * 2 / 1.65;
    const bob = Math.sin(angle * 2) * 2;
    const degrees = angle * 180 / Math.PI;
    rear.setAttribute("transform", `rotate(${degrees * 1.55})`);
    front.setAttribute("transform", `rotate(${degrees * 1.55})`);
    crank.setAttribute("transform", `translate(479 385) rotate(${degrees})`);
    rider.setAttribute("transform", `translate(0 ${bob})`);
    leg(angle + Math.PI, bob, farPath, farFoot, null, true);
    leg(angle, bob, nearPath, nearFoot, nearHighlight, false);
    const flutter = Math.sin(angle * 2 - 0.6) * 4;
    scarf.setAttribute("d", `M517 170Q483 ${174 + flutter} 468 ${160 + flutter}L473 ${177 + flutter}L459 ${182 + flutter}Q489 ${193 + flutter} 519 178Z`);
    road.setAttribute("transform", `translate(${-((time * 135) % 1040)} 0)`);
    // Repeated marks wrap outside the clipped landscape.
    road.innerHTML = Array.from({ length: 12 }, (_, i) =>
      `<path d="M${i * 208} 511h${i % 2 ? 46 : 62}"/>`
    ).join("");
    grasses.setAttribute("transform", `translate(${-((time * 135) % 960)} 0)`);
    clouds.setAttribute("transform", `translate(${Math.sin(time * 0.08) * 14} 0)`);
  }

  // Extend the roadside motif so its cyclic translation has no visible gap.
  for (const x of [1394, 1694, 1994]) {
    const use = document.createElementNS("http://www.w3.org/2000/svg", "use");
    use.setAttribute("href", "#grass");
    use.setAttribute("x", x);
    use.setAttribute("y", "458");
    grasses.appendChild(use);
  }
  grasses.replaceChildren();
  for (let i = 0; i < 7; i++) {
    const use = document.createElementNS("http://www.w3.org/2000/svg", "use");
    use.setAttribute("href", "#grass");
    use.setAttribute("x", 134 + i * 320);
    use.setAttribute("y", "458");
    grasses.appendChild(use);
  }

  function updateButton() {
    toggle.dataset.paused = String(paused);
    toggle.title = paused ? "播放动画" : "暂停动画";
    toggle.setAttribute("aria-label", toggle.title);
  }

  toggle.addEventListener("click", () => {
    paused = !paused;
    previous = null;
    updateButton();
  });

  document.addEventListener("visibilitychange", () => { previous = null; });

  function frame(now) {
    if (previous !== null && !paused && !document.hidden) {
      elapsed += Math.min((now - previous) / 1000, 0.05);
      render(elapsed);
    }
    previous = now;
    requestAnimationFrame(frame);
  }

  updateButton();
  render(0);
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
