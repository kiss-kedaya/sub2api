# Default release build: linux/amd64 archive + checksums only.
#
# The five-platform build with multi-arch images stays in .goreleaser.yaml and
# is selected from the Release workflow ("all_platforms" input, or the
# RELEASE_ALL_PLATFORMS repository variable). Docker images are only built by
# that path, so a published multi-arch tag is never replaced by a single-arch one.
#
# Keep build/archives/checksum identical to .goreleaser.yaml so asset names do
# not change: sub2api_<version>_linux_amd64.tar.gz and checksums.txt.
version: 2

project_name: sub2api

before:
  hooks:
    - go mod tidy -C backend

builds:
  - id: sub2api
    dir: backend
    main: ./cmd/server
    binary: sub2api
    flags:
      - -tags=embed
    env:
      - CGO_ENABLED=0
    goos:
      - linux
    goarch:
      - amd64
    ldflags:
      - -s -w
      - -X main.Version={{.Version}}
      - -X main.Commit={{.Commit}}
      - -X main.Date={{.Date}}
      - -X main.BuildType=release

archives:
  - id: default
    format: tar.gz
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    files:
      - LICENSE*
      - README*
      - deploy/*
      - src: backend/scripts/quality-renderer/*.mjs
        dst: renderer
        strip_parent: true
      - src: backend/scripts/quality-renderer/package*.json
        dst: renderer
        strip_parent: true
      - src: backend/scripts/quality-renderer/README.md
        dst: renderer
        strip_parent: true
      - src: backend/scripts/quality-renderer/test/*.mjs
        dst: renderer/test
        strip_parent: true

checksum:
  name_template: 'checksums.txt'
  algorithm: sha256

changelog:
  # 禁用自动 changelog，完全使用 tag 消息
  disable: true

release:
  github:
    owner: "{{ .Env.GITHUB_REPO_OWNER }}"
    name: "{{ .Env.GITHUB_REPO_NAME }}"
  draft: false
  prerelease: auto
  name_template: "Sub2API {{.Version}}"
  # 完全使用 tag 消息作为 release 内容（通过环境变量传入）
  header: |
    > AI API Gateway Platform - 将 AI 订阅配额分发和管理

    {{ .Env.TAG_MESSAGE }}

  footer: |

    ---

    ## 📥 Installation

    **One-line install (Linux):**
    ```bash
    curl -sSL https://raw.githubusercontent.com/{{ .Env.GITHUB_REPO_OWNER }}/{{ .Env.GITHUB_REPO_NAME }}/main/deploy/install.sh | sudo bash
    ```

    **Manual download (linux/amd64):**
    Download `sub2api_{{ .Version }}_linux_amd64.tar.gz` and `checksums.txt` from the assets below.

    ## 📚 Documentation

    - [GitHub Repository](https://github.com/{{ .Env.GITHUB_REPO_OWNER }}/{{ .Env.GITHUB_REPO_NAME }})
    - [Installation Guide](https://github.com/{{ .Env.GITHUB_REPO_OWNER }}/{{ .Env.GITHUB_REPO_NAME }}/blob/main/deploy/README.md)
